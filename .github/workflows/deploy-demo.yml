name: 部署演示站

# 演示站是 GitHub Pages 上的静态站：整份前端 + 后端逻辑编在一起，数据在构建时打包。
# 只有 main 分支的推送会触发，构建产物就是仓库根目录下 `npm run build:demo` 的结果。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；排队中的旧任务作废，但不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 先验证再发布：演示站是给别人看的门面，坏掉的产物不该上线
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Pages 站点的访问路径（https://<用户名>.github.io/<仓库名>/）。
      # 前端资源必须带这段前缀，交给它算比写死仓库名稳：仓库改名、换用户都不用改代码。
      #
      # enablement 让首次运行不必先去仓库设置里手工开启 Pages（开启后这一项不再起作用）。
      # 若所在仓库的策略不允许用工作流令牌开启，就在 Settings → Pages 里把
      # Source 选成 "GitHub Actions"，然后重跑本工作流。
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - run: npm run build:demo
        env:
          JOBANALYZER_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
