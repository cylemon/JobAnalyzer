<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人信息管理 - Job Analyzer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

  <!-- 左侧导航：由 layout.js 统一渲染，data-nav 指定当前高亮项 -->
  <aside id="sidebar" data-nav="profile" class="sidebar"></aside>

  <!-- 右侧主工作区 -->
  <main class="page-shell">
    <div class="page-sticky">

      <!-- 页头 -->
      <header class="page-header">
        <div>
          <h2 class="page-title">个人信息管理</h2>
          <p class="page-subtitle">管理个人掌握的技术技能与工作经验履历</p>
        </div>

        <div class="page-actions" id="pageActions"></div>
      </header>

      <!-- 个人信息概览横幅（内容由 JS 汇总） -->
      <section class="hero p-6">
        <div class="hero-glow"></div>

        <div class="hero-inner flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-6">

          <div class="flex-1 space-y-2">
            <span class="text-brand-200 text-sm font-semibold uppercase tracking-wider block">技能领域分布</span>
            <div id="bannerSkillStats" class="flex flex-wrap items-center gap-6 text-center pt-1"></div>
          </div>

          <div class="hidden lg:block h-14 w-px bg-brand-400/20"></div>

          <div class="flex-1 space-y-2">
            <span class="text-brand-200 text-sm font-semibold uppercase tracking-wider block">岗位经验年限概况</span>
            <div id="bannerExpStats" class="flex flex-wrap items-center gap-6 text-center pt-1"></div>
          </div>

        </div>
      </section>

    </div>

    <div class="page-body">

      <!-- 技能矩阵与能力储备 -->
      <section class="space-y-4">
        <div class="section-head">
          <h3 class="section-title">技能矩阵与能力储备</h3>
          <button type="button" class="btn btn-primary" data-action="profile:open-skill">
            <i class="fa-solid fa-plus"></i>
            <span>添加技能项</span>
          </button>
        </div>

        <div id="skillsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- 工作经验与履历 -->
      <section class="space-y-4 pt-2">
        <div class="section-head">
          <h3 class="section-title">工作经验与履历</h3>
          <button type="button" class="btn btn-primary" data-action="profile:open-exp">
            <i class="fa-solid fa-plus"></i>
            <span>添加工作履历</span>
          </button>
        </div>

        <div id="experienceContainer" class="space-y-4"></div>
      </section>

    </div>
  </main>

  <!-- 技能新增 / 编辑弹窗 -->
  <div id="skillModal" class="modal">
    <div class="modal-panel modal-md">

      <div class="modal-head">
        <h3 id="skillModalTitle" class="modal-title">添加技能项</h3>
        <button type="button" class="modal-close" data-action="ui:close-modal" data-target="skillModal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="skillForm" data-submit="profile:save-skill" class="flex flex-col flex-1 min-h-0">
        <div class="modal-body">
          <input type="hidden" id="skillId">

          <div>
            <label class="form-label" for="skillName">技能名称</label>
            <input type="text" id="skillName" required class="form-input" placeholder="例如: Python / FastAPI / Kubernetes / 机械绘图">
          </div>

          <div>
            <label class="form-label" for="skillDomain">技能类别领域</label>
            <input type="text" id="skillDomain" required class="form-input" placeholder="例如: AI/大模型技能、编程与后端技能、数据分析技能">
          </div>

          <div>
            <label class="form-label" for="skillLevel">熟练度等级</label>
            <select id="skillLevel" class="form-select">
              <option value="精通">精通 (Master)</option>
              <option value="熟练">熟练 (Proficient)</option>
              <option value="一般">一般 (Intermediate)</option>
              <option value="入门">入门 (Basic)</option>
            </select>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" data-action="ui:close-modal" data-target="skillModal">取消</button>
          <button type="submit" class="btn btn-primary">保存技能</button>
        </div>
      </form>

    </div>
  </div>

  <!-- 履历新增 / 编辑弹窗 -->
  <div id="experienceModal" class="modal">
    <div class="modal-panel modal-lg">

      <div class="modal-head">
        <h3 id="expModalTitle" class="modal-title">添加工作履历</h3>
        <button type="button" class="modal-close" data-action="ui:close-modal" data-target="experienceModal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="expForm" data-submit="profile:save-exp" class="flex flex-col flex-1 min-h-0">
        <div class="modal-body">
          <input type="hidden" id="expId">

          <div class="form-grid">
            <div>
              <label class="form-label" for="expCompany">公司名称</label>
              <input type="text" id="expCompany" required class="form-input" placeholder="例如: 字节跳动">
            </div>
            <div>
              <label class="form-label" for="expRole">岗位名称</label>
              <input type="text" id="expRole" required class="form-input" placeholder="例如: 高级 AI Agent 研发工程师">
            </div>
          </div>

          <div class="form-grid">
            <div>
              <label class="form-label" for="expType">岗位分类 / 类型</label>
              <input type="text" id="expType" required class="form-input" placeholder="例如: 大模型研发、后端架构、测试岗位">
            </div>
            <div>
              <label class="form-label" for="expYears">工作年限 (年)</label>
              <input type="number" step="0.5" id="expYears" required class="form-input" placeholder="2.0">
            </div>
          </div>

          <div>
            <label class="form-label" for="expPeriod">起止时间</label>
            <input type="text" id="expPeriod" required class="form-input" placeholder="例如: 2024.01 - 至今">
          </div>

          <div>
            <label class="form-label" for="expHighlights">核心职责与贡献 (多条用换行分隔)</label>
            <textarea id="expHighlights" rows="3" class="form-textarea" placeholder="负责 AI Agent 智能体编排引擎搭建&#10;优化高并发底层 API 延迟"></textarea>
          </div>

          <div>
            <label class="form-label" for="expTechStack">体现的能力 / 关联技术标签 (用逗号分隔)</label>
            <input type="text" id="expTechStack" class="form-input" placeholder="Python, LangChain, FastAPI, Docker">
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" data-action="ui:close-modal" data-target="experienceModal">取消</button>
          <button type="submit" class="btn btn-primary">保存履历</button>
        </div>
      </form>

    </div>
  </div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/data/profile.data.js"></script>
  <script src="assets/js/pages/profile.page.js"></script>
</body>
</html>
